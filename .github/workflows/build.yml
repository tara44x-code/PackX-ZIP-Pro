name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Lint (informational)
        continue-on-error: true
        run: |
          gradle --no-daemon lintRelease || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/reports/lint-results-*.xml'):
              for issue in ET.parse(path).getroot().iter('issue'):
                  if issue.get('severity') in ('Error', 'Fatal') or issue.get('id') in ('NewApi', 'InlinedApi', 'MissingPermission'):
                      loc = issue.find('location')
                      where = (loc.get('file', '').split('/app/')[-1] + ':' + loc.get('line', '?')) if loc is not None else ''
                      print(issue.get('severity'), issue.get('id'), where, '-', issue.get('message'))
          PY

      - name: Sign APK
        env:
          PACKX_RELEASE_KEY_PEM: ${{ secrets.PACKX_RELEASE_KEY_PEM }}
        run: |
          set -euo pipefail
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          VERSION="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          mkdir -p dist
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" dist/aligned.apk
          # Kept as its own artifact so it can be signed offline with tools/apk_v2_sign.py.
          mkdir -p unsigned && cp dist/aligned.apk "unsigned/PackX-Pro-v$VERSION-unsigned.apk"
          if [ -n "${PACKX_RELEASE_KEY_PEM:-}" ]; then
            printf '%s\n' "$PACKX_RELEASE_KEY_PEM" > "$RUNNER_TEMP/key.pem"
            openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.pk8"
            "$TOOLS/apksigner" sign --key "$RUNNER_TEMP/key.pk8" --cert signing/packx-release-cert.pem \
              --out "dist/PackX-Pro-v$VERSION.apk" dist/aligned.apk
            rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/key.pk8"
            echo "Signed with the PackX release key: installs over earlier PackX Pro versions." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android -alias test \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PackX Pro Test"
            "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:android --key-pass pass:android \
              --out "dist/PackX-Pro-v$VERSION-test-key.apk" dist/aligned.apk
            echo "No PACKX_RELEASE_KEY_PEM secret: signed with a throwaway test key. Uninstall the old app before installing this APK." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm dist/aligned.apk
          "$TOOLS/apksigner" verify --print-certs dist/*.apk | head -4

      - uses: actions/upload-artifact@v4
        with:
          name: PackX-Pro-APK
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PackX-Pro-APK-unsigned
          path: unsigned/*.apk
          if-no-files-found: error

      - name: Publish download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          gh release delete latest-build --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest-build dist/*.apk --target "$GITHUB_SHA" \
            --title "PackX Pro v$VERSION" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. See README for what is new."
